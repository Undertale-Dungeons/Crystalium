name: Build DELTARUNE SHELTER for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "shelter/**"
      - ".github/workflows/shelter-windows.yml"
    branches:
      - main
      - shelter-game

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shelter
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shelter/package.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DELTARUNE-SHELTER-Windows-Installer
          path: shelter/release/*.exe
          if-no-files-found: error
          retention-days: 14
