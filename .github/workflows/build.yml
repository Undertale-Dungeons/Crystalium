name: Build Crystalium installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer (without publishing)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win
      - name: Build and publish tagged release with updater metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crystalium-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
      - name: Publish installer on tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe